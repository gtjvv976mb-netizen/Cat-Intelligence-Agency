# Popcat, the callout bot: every fifteen minutes it reads new pump.fun coins, queues the cat ones,
# runs its on-chain checks and — only with the repository variable POPCAT_LIVE set to 1 —
# publishes every coin it checked to callouts.json on the floor-data branch (a callout when no
# check found a red flag, "spotted" with its red flags when one did), with at most one pick per
# six-hour window, then deploys the site. Without POPCAT_LIVE it is a dry run that prints what it
# would publish. Either way the run's summary (the Actions tab) shows the pick and its draft.
#
# Its schedule runs as the GitHub account that last changed this file. A commit whose author is
# not a GitHub account leaves the schedule with no one to run as, and it never fires; this line
# was saved through the GitHub API so the owner's account is the one on record.
#
# Why every fifteen minutes: pump.fun lists only its newest 1,050 coins, about forty minutes of
# launches, and GitHub may run a schedule late or skip it. At this pace one skipped run still
# leaves the next inside the listing, and Popcat's queue (popcat-state.json) keeps every cat coin
# it has seen until it is checked. A stretch it could not list is named in the log.
#
# Popcat never posts a callout on pump.fun: pump.fun's terms forbid automated callouts. The pick
# is for the owner to post by hand (README: "CashCat and Popcat").
#
# Secrets it reads (all optional): SOLANA_RPC_URL (recommended; the public endpoint refuses some
# reads), ANTHROPIC_API_KEY (a model then confirms each coin is a cat and fit to print).
# Variables: POPCAT_LIVE, POPCAT_MODEL, CASHCAT_WALLET_ADDRESS (so CashCat's coins are never
# listed). It holds no key and cannot buy anything.
name: Popcat

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: popcat
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.push.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check out floor-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bots/floor-data.mjs checkout .floor-data
      - name: Popcat
        env:
          POPCAT_LIVE: ${{ vars.POPCAT_LIVE }}
          POPCAT_MODEL: ${{ vars.POPCAT_MODEL }}
          CASHCAT_WALLET_ADDRESS: ${{ vars.CASHCAT_WALLET_ADDRESS }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node bots/popcat/run.mjs --data-dir .floor-data
      - name: Push the callouts to floor-data
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'node bots/floor-data.mjs push .floor-data --files callouts.json,popcat-state.json --message "Popcat: checked cat coins"'

  deploy:
    needs: run
    if: needs.run.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
