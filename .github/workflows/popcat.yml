# Popcat, the callout bot: every 25 minutes it reads new pump.fun coins, keeps the cat ones,
# runs its on-chain checks, and — only with the repository variable POPCAT_LIVE set to 1 —
# publishes the coins that pass every check to callouts.json on the floor-data branch, then
# deploys the site. Without POPCAT_LIVE it is a dry run that prints what it would publish.
#
# Secrets it reads (all optional): SOLANA_RPC_URL (recommended; the public endpoint refuses some
# reads), ANTHROPIC_API_KEY (a model then confirms each coin is a cat and fit to print).
# Variables: POPCAT_LIVE, POPCAT_MODEL, CASHCAT_WALLET_ADDRESS (so CashCat's coins are never
# called out). It holds no key and cannot buy anything.
name: Popcat

on:
  schedule:
    - cron: "7,32 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: popcat
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.push.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check out floor-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bots/floor-data.mjs checkout .floor-data
      - name: Popcat
        env:
          POPCAT_LIVE: ${{ vars.POPCAT_LIVE }}
          POPCAT_MODEL: ${{ vars.POPCAT_MODEL }}
          CASHCAT_WALLET_ADDRESS: ${{ vars.CASHCAT_WALLET_ADDRESS }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node bots/popcat/run.mjs --data-dir .floor-data
      - name: Push the callouts to floor-data
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bots/floor-data.mjs push .floor-data --files callouts.json,popcat-state.json --message "Popcat: callouts"

  deploy:
    needs: run
    if: needs.run.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
